# Cost measurement on CIC-IDS2017 for the compute plan, not a result. Same budget as the NSL-KDD config.
run_id: measure_cicids2017_rf
dataset: cicids2017
split: stratified_random
split_params:          # test cut is fixed by test_seed; train/validation follow the run seed
  val_fraction: 0.2
  test_fraction: 0.2
  test_seed: 0
model: rf              # rule_only | rf | xgb | mlp_ce | ltn_sup | ltn_full | cnn1d
kb: null
evaluate_test: false   # true only for final runs; tuning runs never touch the test set
seeds: [0]
params:                # starting values, moved by the tuning
  n_estimators: 300
  max_depth: null
  min_samples_leaf: 1
  max_features: sqrt
training:              # no epochs: nothing is selected on the validation set
  imbalance: none               # none | class_weight (weights go in as sample_weight)
  # class_weight_power: 1.0     # only with class_weight: weight ~ count**-power
