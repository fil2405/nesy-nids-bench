# LTN-full; as LTN-sup plus the domain weight and the width of the graded conditions.
# Same budget in every arm: 20 trials x 3 seeds, Latin hypercube, validation macro-F1 only.
tuning_id: tune_cicids2017_ltn_full
base: configs/cicids2017_ltn_full.yaml
trials: 20
search_seed: 0
seeds: [100, 101, 102]   # not among the 10 final seeds
trial_set:               # tuning trials only, the final runs keep the whole train
  split_params.train_class_fractions: {Normal: 0.25}
set:
  network.hidden_units: [256, 128]
  network.dropout: 0.2
  training.batch_size: 256
  training.max_epochs: 100
space:
  training.learning_rate: {loguniform: [3.0e-4, 3.0e-3]}
  training.sampling_power: {uniform: [0.0, 0.5]}
  training.min_per_class: {choice: [2, 4, 8, 16]}
  training.p: {choice: [1, 2, 4, 6]}
  training.domain_weight: {choice: [0.1, 0.25, 0.5]}
  training.s_scale: {loguniform: [0.5, 2.0]}   # multiplies every s of the KB
